# Render Blueprint (https://render.com): one-click HTTPS API + managed PostgreSQL.
# UNVERIFIED: I could not deploy this (needs your Render account). Review plans/regions/prices before applying.
services:
  - type: web
    name: molotov-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: singapore
    plan: starter
    healthCheckPath: /ready
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: SANDBOX_MODE
        value: "true"
      - key: PAYMENT_PROVIDER
        value: disabled
      - key: TRUST_PROXY
        value: "1"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: molotov-db
          property: connectionString
databases:
  - name: molotov-db
    region: singapore
    plan: basic-256mb
    postgresMajorVersion: "16"
